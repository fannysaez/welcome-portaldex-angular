<section class="relative min-h-screen overflow-hidden bg-slate-950 px-6 py-20 text-white">
  <!-- Background spatial -->
  <div class="absolute inset-0 bg-[radial-gradient(circle_at_top,#1e293b_0%,#020617_65%)]"></div>

  <!-- Glow portail -->
  <div
    class="absolute left-1/2 top-0 h-[500px] w-[500px] -translate-x-1/2 rounded-full bg-green-400/10 blur-[150px]"
  ></div>

  <!-- Contenu -->
  <div class="relative z-10 mx-auto max-w-7xl">
    <!-- Header de page -->
    <div class="mb-16 text-center">
      <span
        class="rounded-full border border-green-400/30 bg-green-400/10 px-4 py-2 text-sm uppercase tracking-[0.3em] text-green-300"
      >
        Multiverse Database
      </span>

      <h1 class="mt-6 text-5xl font-black md:text-6xl">
        Episodes du
        <span
          class="bg-gradient-to-r from-green-300 via-cyan-300 to-green-400 bg-clip-text text-transparent"
        >
          multivers
        </span>
      </h1>

      <p class="mx-auto mt-6 max-w-2xl text-lg text-slate-300">
        Retrouvez chaque episode et sa date de premiere diffusion a travers le multivers.
      </p>
    </div>

    <!-- Liste des episodes -->
    <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
      @for (episode of episodes(); track episode.id) {
        <article
          class="group relative flex items-center justify-between overflow-hidden rounded-3xl border border-green-400/20 bg-slate-900/70 p-6 shadow-xl backdrop-blur-xl transition duration-500 hover:-translate-y-1 hover:border-green-400/60 hover:shadow-[0_0_40px_rgba(74,222,128,0.25)]"
        >
          <div>
            <span class="rounded-full bg-green-400/10 px-3 py-1 text-sm font-semibold text-green-300">
              {{ episode.episode }}
            </span>

            <p class="mt-3 text-xl font-bold text-white">{{ episode.name }}</p>
          </div>

          <div class="text-right">
            <p class="text-xs uppercase tracking-widest text-slate-500">1ere diffusion</p>
            <p class="text-lg font-semibold text-cyan-300">{{ episode.air_date }}</p>
          </div>
        </article>
      }
    </div>
  </div>
</section>
